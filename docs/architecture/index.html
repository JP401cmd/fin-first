<style>
  :root {

    --paper-2: #ffffff;
    --ink: #221f1c;
    --ink-soft: #5c554d;
    --ink-faint: #8a8178;
    --line: #e7e1d8;
    --line-2: #d8d0c4;
    --kern: #b45309;
    --wil: #0f766e;
    --horizon: #7c3aed;
    --l1: #475569;
    --l2: #0e7490;
    --l3: #6d28d9;
    --l4: #b45309;
    --l5: #0f766e;
    --get: #15803d;
    --post: #1d4ed8;
    --put: #b45309;
    --del: #b91c1c;
    --shadow: 0 1px 2px rgba(40,30,20,.04), 0 8px 24px rgba(40,30,20,.05);
    --serif: "Iowan Old Style", "Palatino Linotype", "Palatino", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px 96px; }

  /* ── header ─────────────────────────────────────────────── */
  header.top { padding: 48px 0 24px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
  h1.title { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 5vw, 46px); line-height: 1.04; margin: 12px 0 6px; letter-spacing: -.01em; }
  h1.title small { font-family: var(--mono); font-size: 14px; font-weight: 400; color: var(--ink-faint); letter-spacing: 0; }
  .philosophy { font-family: var(--serif); font-style: italic; font-size: clamp(16px, 2.4vw, 20px); color: var(--ink-soft); max-width: 760px; margin: 4px 0 0; }
  .tagline { color: var(--ink-soft); max-width: 720px; margin: 8px 0 0; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 18px; }

  /* ── stat chips ─────────────────────────────────────────── */
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  .stat { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 92px; box-shadow: var(--shadow); }
  .stat b { display: block; font-family: var(--serif); font-size: 24px; line-height: 1; }
  .stat span { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; }

  /* ── diff banner ────────────────────────────────────────── */
  .diff { margin: 26px 0 0; border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line-2); background: var(--paper-2); box-shadow: var(--shadow); }
  .diff.changed { border-color: #c9a227; background: linear-gradient(180deg, #fffdf3, #fffaf0); }
  .diff h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; }
  .diff ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
  .diff li { padding: 3px 0; font-size: 14px; }
  .tag-add { color: var(--get); font-weight: 700; }
  .tag-rem { color: var(--del); font-weight: 700; }
  .pill-mini { font-family: var(--mono); font-size: 12px; background: #f1ece3; border-radius: 6px; padding: 1px 7px; margin: 0 3px; display: inline-block; }

  /* ── toolbar ────────────────────────────────────────────── */
  .toolbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 0; margin: 22px 0 8px; background: linear-gradient(180deg, var(--paper) 70%, rgba(251,250,247,0)); }
  .search { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; box-shadow: var(--shadow); }
  .search input { border: 0; outline: 0; background: transparent; font-size: 15px; width: 100%; color: var(--ink); font-family: var(--sans); }
  .search svg { flex: none; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); user-select: none; cursor: pointer; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; box-shadow: var(--shadow); }
  .toggle input { accent-color: var(--horizon); }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump a { font-family: var(--mono); font-size: 11.5px; text-decoration: none; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: var(--paper-2); }
  .jump a:hover { border-color: var(--ink-faint); }

  /* ── layer band ─────────────────────────────────────────── */
  .band { display: grid; grid-template-columns: 168px 1fr; gap: 26px; padding: 30px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 76px; }
  .band-rail { position: relative; }
  .band-rail .num { font-family: var(--mono); font-size: 12px; color: #fff; background: var(--accent, #475569); border-radius: 7px; padding: 2px 8px; display: inline-block; }
  .band-rail h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 12px 0 6px; line-height: 1.12; }
  .band-rail p { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .band-rail .bar { position: absolute; left: -22px; top: 4px; bottom: -30px; width: 4px; border-radius: 4px; background: var(--accent, #475569); opacity: .9; }
  .band-body { min-width: 0; }

  /* ── module cards ───────────────────────────────────────── */
  .mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mod { border: 1px solid var(--line); border-top: 3px solid var(--mc, #888); border-radius: 12px; background: var(--paper-2); box-shadow: var(--shadow); overflow: hidden; }
  .mod > summary { list-style: none; cursor: pointer; padding: 14px 15px; }
  .mod > summary::-webkit-details-marker { display: none; }
  .mod .mlabel { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .mod .mtag { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .mod .mcount { float: right; font-family: var(--mono); font-size: 13px; color: var(--mc, #555); font-weight: 600; }
  .mod .routes { padding: 0 15px 14px; }

  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); box-shadow: var(--shadow); overflow: hidden; }
  .card > summary, .acc > summary { list-style: none; cursor: pointer; padding: 13px 15px; display: flex; align-items: center; gap: 10px; }
  .card > summary::-webkit-details-marker, .acc > summary::-webkit-details-marker { display: none; }
  .card > summary:hover, .acc > summary:hover { background: #fbf7f0; }
  .chevron { transition: transform .15s ease; color: var(--ink-faint); flex: none; }
  details[open] > summary .chevron { transform: rotate(90deg); }
  .sumlabel { font-weight: 600; }
  .sumcount { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--ink-faint); background: #f3eee6; padding: 1px 9px; border-radius: 999px; }
  .card .body, .acc .body { padding: 4px 15px 14px; }

  .acc { border: 1px solid var(--line); border-radius: 11px; background: var(--paper-2); margin-bottom: 10px; box-shadow: var(--shadow); }

  /* ── route / leaf lists ─────────────────────────────────── */
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { display: flex; align-items: baseline; gap: 9px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
  li.item:first-child { border-top: 0; }
  li.item code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  li.item .file { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  .badge-test { font-family: var(--mono); font-size: 10px; color: #92400e; background: #fef3c7; border-radius: 5px; padding: 0 5px; }
  body.hide-test li.item[data-test="1"] { display: none; }

  .methods { display: inline-flex; gap: 4px; flex: none; }
  .m { font-family: var(--mono); font-size: 10px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; letter-spacing: .02em; }
  .m.GET { background: var(--get); } .m.POST { background: var(--post); }
  .m.PUT, .m.PATCH { background: var(--put); } .m.DELETE { background: var(--del); }
  .m.OPTIONS, .m.HEAD { background: #6b7280; }

  /* ── chips ──────────────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; background: var(--paper-2); color: var(--ink-soft); }
  .chip b { color: var(--ink); font-weight: 600; }

  /* ── mechanisms ─────────────────────────────────────────── */
  .mech-intro { font-family: var(--serif); font-size: 16px; color: var(--ink-soft); max-width: 760px; margin: 0 0 16px; font-style: italic; }
  .mechs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mech { border: 1px solid #ddd4f0; border-radius: 14px; background: linear-gradient(180deg, #fcfbff, #faf8ff); padding: 16px 16px 14px; box-shadow: var(--shadow); }
  .mech .mh { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .mech .mfile { font-family: var(--mono); font-size: 11.5px; color: var(--l3); margin: 3px 0 9px; word-break: break-all; }
  .mech .msum { font-size: 13.5px; color: var(--ink-soft); }
  .mech .mext { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
  .mech .mext b { color: var(--l3); }
  .mech .inst { margin-top: 11px; }
  .mech .inst .ilab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-bottom: 5px; }
  .coach-layer { font-size: 12.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .coach-layer:first-child { border-top: 0; }
  .coach-layer b { color: var(--ink); }

  /* ── phases ─────────────────────────────────────────────── */
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-radius: 11px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: var(--shadow); }
  .phase { padding: 13px 14px; color: #fff; }
  .phase .pl { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .phase .plv { font-family: var(--mono); font-size: 11.5px; opacity: .92; }

  .note { font-size: 13px; color: var(--ink-soft); }
  .section-h { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); margin: 20px 0 9px; }

  /* ── footer ─────────────────────────────────────────────── */
  footer { padding: 34px 0 0; }
  .principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 10px 0 26px; }
  .principle { font-family: var(--serif); font-size: 15px; color: var(--ink-soft); border-left: 3px solid var(--horizon); padding: 4px 0 4px 12px; }
  .howto { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .howto code { font-family: var(--mono); font-size: 12.5px; background: #f3eee6; padding: 2px 7px; border-radius: 6px; }
  .empty { display: none; padding: 30px; text-align: center; color: var(--ink-faint); font-family: var(--serif); font-style: italic; font-size: 18px; }

  @media (max-width: 820px) {
    .band { grid-template-columns: 1fr; gap: 14px; }
    .band-rail .bar { display: none; }
    .mods, .mechs { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .phases { grid-template-columns: repeat(2, 1fr); }
  }
</style>

// ── diff banner ───────────────────────────────────────────────────────────
function diffBanner() {
  const d = DATA.diff || {};
  if (d.baseline) return `<div class="diff"><h3>Wat is er veranderd</h3><div class="note">Eerste snapshot vastgelegd — vanaf de volgende run verschijnen hier de dagelijkse wijzigingen.</div></div>`;
  if (!d.hasChanges) return `<div class="diff"><h3>Wat is er veranderd</h3><div class="note">Geen wijzigingen sinds ${esc(d.previousDate || 'de vorige run')}.</div></div>`;
  const rows = d.sections.map((sec) => {
    const parts = [];
    if (sec.added && sec.added.length) parts.push(`<span class="tag-add">+${sec.added.length}</span> ${sec.added.map((x) => `<span class="pill-mini">${esc(x)}</span>`).join('')}`);
    if (sec.removed && sec.removed.length) parts.push(`<span class="tag-rem">−${sec.removed.length}</span> ${sec.removed.map((x) => `<span class="pill-mini">${esc(x)}</span>`).join('')}`);
    return `<li><b>${esc(sec.label)}</b> — ${parts.join(' &nbsp; ')}</li>`;
  }).join('');
  return `<div class="diff changed"><h3>Wat is er veranderd sinds ${esc(d.previousDate || '')}</h3><ul>${rows}</ul></div>`;
}

function routeItem(r) {
  const search = ds(r.url + ' ' + r.file);
  return `<li class="item" data-search="${search}" data-test="${r.isTest ? 1 : 0}">
    <code>${esc(r.url)}</code>${r.isTest ? ' <span class="badge-test">test</span>' : ''}
    <span class="file">${esc(r.file.replace(/^app\//, ''))}</span></li>`;
}
function apiItem(r) {
  const search = ds(r.url + ' ' + (r.methods || []).join(' '));
  const methods = (r.methods || []).map((m) => `<span class="m ${m}">${m}</span>`).join('');
  return `<li class="item" data-search="${search}" data-test="0">
    <span class="methods">${methods || '<span class="m OPTIONS">?</span>'}</span>
    <code>${esc(r.url)}</code></li>`;
}

function frontendBand() {
  const byGroup = DATA.routesByGroup || {};
  const modCards = ['kern', 'wil', 'horizon'].map((key) => {
    const m = MODS[key] || {};
    const routes = byGroup[key] || [];
    return `<details class="mod" open style="--mc:${esc(m.color || '#888')}">
      <summary><span class="mcount">${routes.length}</span><div class="mlabel">${esc(m.label || key)}</div><div class="mtag">${esc(m.tagline || '')}</div></summary>
      <div class="routes"><ul class="list">${routes.map(routeItem).join('') || '<li class="note">—</li>'}</ul></div>
    </details>`;
  }).join('');

  const others = [['persoonlijk', 'Persoonlijk & rapportage'], ['beheer', 'Beheer'], ['onboarding', 'Onboarding'], ['publiek', 'Publiek & auth'], ['overig', 'Overig']]
    .filter(([k]) => (byGroup[k] || []).length)
    .map(([k, label]) => acc(label, (byGroup[k] || []).length, `<ul class="list">${(byGroup[k] || []).map(routeItem).join('')}</ul>`)).join('');

  const provs = `<div class="chips">${(DATA.providers || []).map((p) => `<span class="chip" data-search="${ds(p.name)}">${esc(p.name)}</span>`).join('')}</div>`;
  const comp = DATA.components || { groups: [] };
  const compGroups = comp.groups.map((g) => acc('components/' + g.group, g.count, `<div class="chips">${g.items.map((i) => `<span class="chip" data-search="${ds(g.group + ' ' + i)}">${esc(i)}</span>`).join('')}</div>`)).join('');

  return band('frontend', 'l1', '1', 'Frontend', A.layers && A.layers.frontend, `
    <div class="mods">${modCards}</div>
    <div class="section-h">Overkoepelende schermen</div>
    ${others}
    <div class="section-h">Globale providers (app-shell) · ${(DATA.providers || []).length}</div>
    ${provs}
    <div class="section-h">Componenten · ${comp.total}</div>
    ${compGroups}
  `);
}

  const mechs = (A.mechanisms || []).map(mechCard).join('');
  const mods = (DATA.modules && DATA.modules.modules) || [];
  const modChips = `<div class="chips">${mods.map((m) => `<span class="chip" data-search="${ds(m.id + ' ' + m.label)}"><b>${esc(m.label)}</b> · ${esc(m.id)}</span>`).join('')}</div>`;
  const phases = (DATA.phases && DATA.phases.phases) || [];
  const phaseColors = { recovery: '#9f1239', stability: '#1d4ed8', momentum: '#0f766e', mastery: '#b45309' };
  const phaseBar = `<div class="phases">${phases.map((p) => `<div class="phase" style="background:${phaseColors[p.id] || '#555'}"><div class="pl">${esc(p.label)}</div><div class="plv">niveau ${esc((p.levels || []).join(', '))}</div></div>`).join('')}</div>`;
  return band('domain', 'l3', '3', 'Domein & AI', A.layers && A.layers.domain, `
    <div class="mech-intro">${esc(A.mechanismsIntro || '')}</div>
    <div class="mechs">${mechs}</div>
    <div class="section-h">Functionele modules · ${mods.length}</div>
    ${modChips}
    <div class="section-h">Soevereiniteitsniveaus → fasen · ${phases.length}</div>
    ${phaseBar}
  `);
}

// ── L4 data ──────────────────────────────────────────────────────────────────
function dataBand() {
  const doms = (DATA.tablesByDomain || []).map((d) =>
    acc(d.domain, d.tables.length, `<div class="chips">${d.tables.map((t) => `<span class="chip" data-search="${ds(t.name)}">${esc(t.name)}</span>`).join('')}</div>`)).join('');
  const intro = `<div class="note" style="margin-bottom:12px">${DATA.stats.tables} tabellen · ${DATA.stats.migrations} migraties · Supabase Postgres met RLS & realtime.</div>`;
  return band('data', 'l4', '4', 'Data-laag', A.layers && A.layers.data, intro + doms);
}

// ── L5 integrations ───────────────────────────────────────────────────────────
function integrationsBand() {
  const byCat = {};
  for (const i of DATA.integrations || []) (byCat[i.category] ??= []).push(i);
  const cards = Object.entries(byCat).map(([cat, items]) =>
    `<details class="card" open><summary>${chevron()}<span class="sumlabel">${esc(cat)}</span><span class="sumcount">${items.length}</span></summary>
     <div class="body"><div class="chips">${items.map((i) => `<span class="chip" data-search="${ds(i.name + ' ' + cat)}">${esc(i.name)}</span>`).join('')}</div></div></details>`).join('');
  return band('int', 'l5', '5', 'Integraties', A.layers && A.layers.integrations, `<div class="grid2">${cards}</div>`);
}

// ── building blocks ────────────────────────────────────────────────────────
function acc(label, count, bodyHtml) {
  return `<details class="acc"><summary>${chevron()}<span class="sumlabel">${label}</span><span class="sumcount">${count}</span></summary><div class="body">${bodyHtml}</div></details>`;
}
function band(anchor, accentVar, num, title, desc, bodyHtml) {
  return `<section class="band" id="l-${anchor}" style="--accent:var(--${accentVar})">
    <div class="band-rail"><span class="bar"></span><span class="num">Laag ${num}</span><h2>${esc(title)}</h2><p>${esc(desc || '')}</p></div>
    <div class="band-body">${bodyHtml}</div>
  </section>`;
}

// ── footer ────────────────────────────────────────────────────────────────
function footer() {
  const pr = (A.principles || []).map((p) => `<div class="principle">${esc(p)}</div>`).join('');
  return `<footer>
    <div class="section-h">Ontwerpprincipes</div>
    <div class="principles">${pr}</div>
    <div class="howto">
      <strong>Hoe deze plaat wordt onderhouden.</strong> De feiten worden automatisch uit de code gelezen; het verhaal staat in <code>scripts/architecture/annotations.mjs</code>. Regenereren: <code>npm run arch:diagram</code>. Een dagelijkse taak draait dit en toont bovenaan wat er veranderde.
    </div>
  </footer>`;
}

// ── render + interactions ───────────────────────────────────────────────────
document.getElementById('app').innerHTML =
  header() + diffBanner() + toolbar() +
  frontendBand() + apiBand() + domainBand() + dataBand() + integrationsBand() + footer();

const q = document.getElementById('q');
const empty = document.getElementById('empty');
const showTest = document.getElementById('showTest');

showTest.addEventListener('change', () => {
  document.body.classList.toggle('hide-test', !showTest.checked);
  applyFilter();
});

let t;
q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(applyFilter, 90); });

function applyFilter() {
  const term = q.value.trim().toLowerCase();
  const items = document.querySelectorAll('[data-search]');
  let anyVisible = false;
  items.forEach((el) => {
    const isTestHidden = el.matches('li.item[data-test="1"]') && document.body.classList.contains('hide-test');
    const match = !term || el.getAttribute('data-search').includes(term);
    const visible = match && !isTestHidden;
    el.classList.toggle('filtered-out', !match);
    el.style.display = visible ? '' : (match ? 'none' : 'none');
    if (visible) anyVisible = true;
  });
  // open/close groups based on visible descendants; show empty note
  document.querySelectorAll('details.acc, details.card, details.mod').forEach((d) => {
    const vis = [...d.querySelectorAll('[data-search]')].some((el) => el.style.display !== 'none' && !(el.matches('li.item[data-test="1"]') && document.body.classList.contains('hide-test')));
    d.style.display = (term && !vis) ? 'none' : '';
    if (term && vis) d.open = true;
  });
  empty.style.display = (term && !anyVisible) ? 'block' : 'none';
}

applyFilter();
</script>
</body>
</html>
