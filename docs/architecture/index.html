<style>
  :root {
    --paper: #fbfaf7;
    --paper-2: #ffffff;
    --ink: #221f1c;
    --ink-soft: #5c554d;
    --ink-faint: #8a8178;
    --line: #e7e1d8;
    --line-2: #d8d0c4;
    --kern: #b45309;
    --wil: #0f766e;
    --horizon: #7c3aed;
    --l1: #475569;
    --l2: #0e7490;
    --l3: #6d28d9;
    --l4: #b45309;
    --l5: #0f766e;
    --get: #15803d;
    --post: #1d4ed8;
    --put: #b45309;
    --del: #b91c1c;
    --shadow: 0 1px 2px rgba(40,30,20,.04), 0 8px 24px rgba(40,30,20,.05);
    --serif: "Iowan Old Style", "Palatino Linotype", "Palatino", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px 96px; }

  /* ── header ─────────────────────────────────────────────── */
  header.top { padding: 48px 0 24px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
  h1.title { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 5vw, 46px); line-height: 1.04; margin: 12px 0 6px; letter-spacing: -.01em; }
  h1.title small { font-family: var(--mono); font-size: 14px; font-weight: 400; color: var(--ink-faint); letter-spacing: 0; }
  .philosophy { font-family: var(--serif); font-style: italic; font-size: clamp(16px, 2.4vw, 20px); color: var(--ink-soft); max-width: 760px; margin: 4px 0 0; }
  .tagline { color: var(--ink-soft); max-width: 720px; margin: 8px 0 0; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 18px; }

  /* ── stat chips ─────────────────────────────────────────── */
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  .stat { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 92px; box-shadow: var(--shadow); }
  .stat b { display: block; font-family: var(--serif); font-size: 24px; line-height: 1; }
  .stat span { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; }

  /* ── diff banner ────────────────────────────────────────── */
  .diff { margin: 26px 0 0; border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line-2); background: var(--paper-2); box-shadow: var(--shadow); }
  .diff.changed { border-color: #c9a227; background: linear-gradient(180deg, #fffdf3, #fffaf0); }
  .diff h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; }
  .diff ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
  .diff li { padding: 3px 0; font-size: 14px; }
  .tag-add { color: var(--get); font-weight: 700; }
  .tag-rem { color: var(--del); font-weight: 700; }
  .pill-mini { font-family: var(--mono); font-size: 12px; background: #f1ece3; border-radius: 6px; padding: 1px 7px; margin: 0 3px; display: inline-block; }

  /* ── toolbar ────────────────────────────────────────────── */
  .toolbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 0; margin: 22px 0 8px; background: linear-gradient(180deg, var(--paper) 70%, rgba(251,250,247,0)); }
  .search { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; box-shadow: var(--shadow); }
  .search input { border: 0; outline: 0; background: transparent; font-size: 15px; width: 100%; color: var(--ink); font-family: var(--sans); }
  .search svg { flex: none; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); user-select: none; cursor: pointer; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 13px; box-shadow: var(--shadow); }
  .toggle input { accent-color: var(--horizon); }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump a { font-family: var(--mono); font-size: 11.5px; text-decoration: none; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: var(--paper-2); }
  .jump a:hover { border-color: var(--ink-faint); }

  /* ── layer band ─────────────────────────────────────────── */
  .band { display: grid; grid-template-columns: 168px 1fr; gap: 26px; padding: 30px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 76px; }
  .band-rail { position: relative; }
  .band-rail .num { font-family: var(--mono); font-size: 12px; color: #fff; background: var(--accent, #475569); border-radius: 7px; padding: 2px 8px; display: inline-block; }
  .band-rail h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 12px 0 6px; line-height: 1.12; }
  .band-rail p { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .band-rail .bar { position: absolute; left: -22px; top: 4px; bottom: -30px; width: 4px; border-radius: 4px; background: var(--accent, #475569); opacity: .9; }
  .band-body { min-width: 0; }

  /* ── module cards ───────────────────────────────────────── */
  .mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mod { border: 1px solid var(--line); border-top: 3px solid var(--mc, #888); border-radius: 12px; background: var(--paper-2); box-shadow: var(--shadow); overflow: hidden; }
  .mod > summary { list-style: none; cursor: pointer; padding: 14px 15px; }
  .mod > summary::-webkit-details-marker { display: none; }
  .mod .mlabel { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .mod .mtag { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .mod .mcount { float: right; font-family: var(--mono); font-size: 13px; color: var(--mc, #555); font-weight: 600; }
  .mod .routes { padding: 0 15px 14px; }

  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); box-shadow: var(--shadow); overflow: hidden; }
  .card > summary, .acc > summary { list-style: none; cursor: pointer; padding: 13px 15px; display: flex; align-items: center; gap: 10px; }
  .card > summary::-webkit-details-marker, .acc > summary::-webkit-details-marker { display: none; }
  .card > summary:hover, .acc > summary:hover { background: #fbf7f0; }
  .chevron { transition: transform .15s ease; color: var(--ink-faint); flex: none; }
  details[open] > summary .chevron { transform: rotate(90deg); }
  .sumlabel { font-weight: 600; }
  .sumcount { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--ink-faint); background: #f3eee6; padding: 1px 9px; border-radius: 999px; }
  .card .body, .acc .body { padding: 4px 15px 14px; }

  .acc { border: 1px solid var(--line); border-radius: 11px; background: var(--paper-2); margin-bottom: 10px; box-shadow: var(--shadow); }

  /* ── route / leaf lists ─────────────────────────────────── */
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { display: flex; align-items: baseline; gap: 9px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
  li.item:first-child { border-top: 0; }
  li.item code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  li.item .file { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  .badge-test { font-family: var(--mono); font-size: 10px; color: #92400e; background: #fef3c7; border-radius: 5px; padding: 0 5px; }
  body.hide-test li.item[data-test="1"] { display: none; }

  .methods { display: inline-flex; gap: 4px; flex: none; }
  .m { font-family: var(--mono); font-size: 10px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; letter-spacing: .02em; }
  .m.GET { background: var(--get); } .m.POST { background: var(--post); }
  .m.PUT, .m.PATCH { background: var(--put); } .m.DELETE { background: var(--del); }
  .m.OPTIONS, .m.HEAD { background: #6b7280; }

  /* ── chips ──────────────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; background: var(--paper-2); color: var(--ink-soft); }
  .chip b { color: var(--ink); font-weight: 600; }

  /* ── mechanisms ─────────────────────────────────────────── */
  .mech-intro { font-family: var(--serif); font-size: 16px; color: var(--ink-soft); max-width: 760px; margin: 0 0 16px; font-style: italic; }
  .mechs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mech { border: 1px solid #ddd4f0; border-radius: 14px; background: linear-gradient(180deg, #fcfbff, #faf8ff); padding: 16px 16px 14px; box-shadow: var(--shadow); }
  .mech .mh { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .mech .mfile { font-family: var(--mono); font-size: 11.5px; color: var(--l3); margin: 3px 0 9px; word-break: break-all; }
  .mech .msum { font-size: 13.5px; color: var(--ink-soft); }
  .mech .mext { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
  .mech .mext b { color: var(--l3); }
  .mech .inst { margin-top: 11px; }
  .mech .inst .ilab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-bottom: 5px; }
  .coach-layer { font-size: 12.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .coach-layer:first-child { border-top: 0; }
  .coach-layer b { color: var(--ink); }

  /* ── phases ─────────────────────────────────────────────── */
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-radius: 11px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: var(--shadow); }
  .phase { padding: 13px 14px; color: #fff; }
  .phase .pl { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .phase .plv { font-family: var(--mono); font-size: 11.5px; opacity: .92; }

  .note { font-size: 13px; color: var(--ink-soft); }
  .section-h { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); margin: 20px 0 9px; }

  /* ── footer ─────────────────────────────────────────────── */
  footer { padding: 34px 0 0; }
  .principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 10px 0 26px; }
  .principle { font-family: var(--serif); font-size: 15px; color: var(--ink-soft); border-left: 3px solid var(--horizon); padding: 4px 0 4px 12px; }
  .howto { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .howto code { font-family: var(--mono); font-size: 12.5px; background: #f3eee6; padding: 2px 7px; border-radius: 6px; }
  .empty { display: none; padding: 30px; text-align: center; color: var(--ink-faint); font-family: var(--serif); font-style: italic; font-size: 18px; }

  @media (max-width: 820px) {
    .band { grid-template-columns: 1fr; gap: 14px; }
    .band-rail .bar { display: none; }
    .mods, .mechs { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .phases { grid-template-columns: repeat(2, 1fr); }
  }
</style>

":true},"news_editions":{"user":true,"household":false,"rls":true},"_legacy_holdings":{"user":true,"household":false,"rls":true},"_legacy_holding_transactions":{"user":true,"household":false,"rls":true},"_legacy_holding_prices":{"user":false,"household":false,"rls":true},"signup_email_allowlist":{"user":true,"household":false,"rls":true},"web_vitals":{"user":true,"household":false,"rls":true},"fire_assumptions":{"user":false,"household":false,"rls":true}}},"adrs":[{"id":"0001-soevereiniteit-is-motivatie","title":"Soevereiniteit is motivatie, geen feature-gating","status":"aanvaard","date":"2026-03-01","elements":["m-soeverein","app-comp"],"summary":"Soevereiniteitsniveaus (Recovery → Mastery) bepalen niet langer welke functionaliteit zichtbaar is; ze dienen als motivatie- en voortgangsmodel. De gebruiker kiest zelf welke modules actief zijn.","file":"docs/adr/0001-soevereiniteit-is-motivatie.md"},{"id":"0002-spaarquote-drijft-fire","title":"Spaarquote × inkomen drijft de FIRE-prognose","status":"aanvaard","date":"2026-06-01","elements":["as-budget","as-planning","fn-toekomstplannen"],"summary":"De sparen-invoer van de FIRE-prognose komt uit de cashflow-spaarquote maal het inkomen, niet uit een losse handmatige spaarwaarde. Eén bron van waarheid van transactie tot vrijheidsdatum.","file":"docs/adr/0002-spaarquote-drijft-fire.md"},{"id":"0003-supabase-auth-canoniek","title":"Supabase Auth is het canonieke auth-model","status":"aanvaard","date":"2026-06-01","elements":["t-supabase","data-cont"],"summary":"Authenticatie en autorisatie lopen volledig via Supabase Auth met Row Level Security op `auth.uid()`. De better-auth-scaffolding in `src/lib` is geen onderdeel van het lopende model.","file":"docs/adr/0003-supabase-auth-canoniek.md"},{"id":"0004-huishouden-via-rls-rpc","title":"Huishouden-perspectieven via RLS-veilige RPC's","status":"aanvaard","date":"2026-06-08","elements":["as-huishouden","t-supabase","do-huishouden"],"summary":"Een partner ziet huishoud- en partnergegevens uitsluitend via RPC-functies met een eigendoms- en privacycheck — nooit via directe tabel-selects over de huishoudgrens.","file":"docs/adr/0004-huishouden-via-rls-rpc.md"},{"id":"0005-android-via-twa","title":"Android-distributie via TWA (Bubblewrap)","status":"aanvaard","date":"2026-05-20","elements":["t-platform"],"summary":"De Android-app is een Trusted Web Activity (TWA) rond de PWA, gegenereerd met Bubblewrap — niet Capacitor of een full-native build.","file":"docs/adr/0005-android-via-twa.md"},{"id":"0006-superadmin-inzage-via-service-role","title":"Superadmin-inzage via service-role, nooit via RLS","status":"aanvaard","date":"2026-06-11","elements":["t-supabase","do-huishouden"],"summary":"Cross-user leesrecht voor beheer (supportview, AVG-export, platform-KPI's) loopt uitsluitend via de service-role-client in `/api/admin/*`-routes met een expliciete superadmin-check en audit-log — nooit via RLS-policies op persoonlijke tabellen.","file":"docs/adr/0006-superadmin-inzage-via-service-role.md"},{"id":"0007-briefing-een-engine","title":"Eén briefing-engine — deterministische feiten, AI als redacteur","status":"aanvaard","date":"2026-06-11","elements":["as-coach","t-aigateway","sp-inzicht"],"summary":"De wekelijkse briefing op /overzicht heeft één engine: de deterministische `buildBriefingEntries` (lib/briefing/engine.ts) levert alle cijfers en briefjes; de LLM mag uitsluitend **redigeren** (kop-zin + tekst-herschrijving) via `lib/briefing/redactie.ts`, met een harde nummer-gu","file":"docs/adr/0007-briefing-een-engine.md"},{"id":"0008-gezondheidsgetal-een-bron","title":"Het gezondheidsgetal kent één canonieke berekening","status":"aanvaard","date":"2026-06-12","elements":["as-planning"],"summary":"De financiële gezondheidsscore (0–100, 7-pijler) heeft één canonieke berekening: `computeHealthScoreFromInputs` (lib/financial-health.ts) op een input die door één gedeeld pad wordt gebouwd (`buildHealthScoreInput` in lib/health-score-input.ts). Het \"huidige\" getal is overal live","file":"docs/adr/0008-gezondheidsgetal-een-bron.md"},{"id":"0009-vrijheidsvoortgang-unified-grondslag","title":"Vrijheidsvoortgang single-sourced op de unified-projection-grondslag","status":"vervangen","date":"2026-06-12","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"Vrijheidsvoortgang (freedomPct) heeft één canonieke grondslag: FIRE-eligible netto vermogen ÷ benodigde portfolio uit de unified projection. 100% betekent per definitie dat het FIRE-doel is bereikt; het eigen huis telt alleen mee voor zover de housing-strategie het vrijspeelt. Eé","file":"docs/adr/0009-vrijheidsvoortgang-unified-grondslag.md"},{"id":"0010-gezondheidsgetal-v2","title":"Gezondheidsgetal v2 — vier gedragspijlers","status":"aanvaard","date":"2026-06-12","elements":["as-budget","as-vermogen","as-planning","as-belasting"],"summary":"Het gezondheidsgetal (0–100) wordt geherstructureerd van 7 vlakke pijlers met handmatige gewichten naar **vier gedragspijlers** (Rondkomen 35% · Buffer 20% · Schuld 20% · Vrijheid 25%) met 7 actieve indicatoren, in lijn met de internationale frameworks (FHN FinHealth Score, CFPB,","file":"docs/adr/0010-gezondheidsgetal-v2.md"},{"id":"0011-budget-referenties-on-delete-set-null","title":"Budget-FK's — ON DELETE SET NULL voor referentie-data, CASCADE voor levenscyclus-data","status":"aanvaard","date":"2026-06-12","elements":["as-budget","data-cont"],"summary":"FK's naar `budgets(id)` krijgen ON DELETE SET NULL (referentie-data: transacties, doelen, leer-regels) of CASCADE (levenscyclus-data: bedragen, rollovers, ouder-kind-relaties) — nooit de default NO ACTION. Alle tabelstructuur gaat via migraties in de repo; anders is ze onzichtbaa","file":"docs/adr/0011-budget-referenties-on-delete-set-null.md"},{"id":"0012-housing-trigger-uit-unified-projection","title":"Huis-strategie \"wanneer nodig\"-trigger uit de unified projection (vaste-punt-iteratie)","status":"aanvaard","date":"2026-06-13","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"Het trigger-moment van de eigen-huis-strategie (downsize / opeethypotheek × \"wanneer nodig\") wordt afgeleid uit **dezelfde unified-projection-engine als de grafiek**, via een capped vaste-punt-iteratie in `lib/housing-trigger.ts`. De event-marker, de verkoop-cashflow, de vastgoed","file":"docs/adr/0012-housing-trigger-uit-unified-projection.md"},{"id":"0013-horizon-grootboek-engine-v2","title":"horizon grootboek engine v2","status":"vervangen","date":"2026-06-13","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De productie-engine `runUnifiedProjection` (`lib/unified-projection.ts`) bepaalt de FIRE-leeftijd via een forward-loop met per-leeftijd een binary search (`requiredAt`, met geneste decumulatie-subsimulatie). Dat is ondoorzichtig, duur en moeilijk uit te breiden; een reeks gewenst","file":"docs/adr/0013-horizon-grootboek-engine-v2.md"},{"id":"0014-horizon-v2-legacy-need-only","title":"horizon v2 legacy need only","status":"aanvaard","date":"2026-06-13","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De gedeelde onttrekkingsmotor `applyWithdrawalStrategy` (`lib/withdrawal-strategy.ts`) berekent voor de eindstrategie **legacy** een *spend-down-annuïteit*: `computeAnnuityBase` zet de contante waarde van het nalatenschapsbedrag apart en onttrekt het resterende surplus via een gr","file":"docs/adr/0014-horizon-v2-legacy-need-only.md"},{"id":"0015-horizon-v2-downsize-asset-liquidatie","title":"horizon v2 downsize asset liquidatie","status":"aanvaard","date":"2026-06-13","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De downsize-strategie (verkoop eigen woning bij uitputting / op leeftijd) werd gemodelleerd op de v1-manier: `filterAssetsForFire` haalt het eigen huis + de gekoppelde hypotheek **uit de FIRE-pot**, en `resolveHousingEventsForSim` spuit de verkoop als een eenmalig **inkomen** in ","file":"docs/adr/0015-horizon-v2-downsize-asset-liquidatie.md"},{"id":"0016-horizon-v2-cutover-acceptatie-en-reeel-nominaal","title":"horizon v2 cutover acceptatie en reeel nominaal","status":"vervangen","date":"2026-06-13","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"v2 (de grootboek-engine, ADR 0013) draait live achter een per-user flag. De validatiefase (Fase B uit `docs/horizon-tabel-rekenmotor-plan.md` §6) is grotendeels gedaan: de parity-review (B2) en de regressiesuites (B4) zijn klaar, en surfacede drie echte v2-bugs die inmiddels gefi","file":"docs/adr/0016-horizon-v2-cutover-acceptatie-en-reeel-nominaal.md"},{"id":"0017-horizon-v2-legacy-doelzoekende-fire","title":"horizon v2 legacy doelzoekende fire","status":"aanvaard","date":"2026-06-14","elements":["as-planning","fn-toekomstplannen"],"summary":"ADR 0014 legde vast dat de eindstrategie **legacy** in de v2-grootboek-engine (`lib/horizon-engine/engine.ts`) **need-only** onttrekt: alleen de netto leefbehoefte wordt onttrokken, het residu blijft belegd en groeit naar de nalatenschap. Dat besluit blijft staan — `lib/withdrawa","file":"docs/adr/0017-horizon-v2-legacy-doelzoekende-fire.md"},{"id":"0018-benchmark-gemodelleerde-referentie-peer","title":"benchmark gemodelleerde referentie peer","status":"aanvaard","date":"2026-06-16","elements":["as-rapport","as-planning","as-vermogen"],"summary":"De benchmarkrapportage op `/rapportages/benchmark` vergelijkt vijf canonieke gebruikersmaten (gezondheidsscore, vrijheidsleeftijd, spaarquote, netto vermogen, geschat jaarinkomen) met een referentie. Voor drie van de vijf maten bestaan officiële NL-statistieken (CBS Vermogen 2024","file":"docs/adr/0018-benchmark-gemodelleerde-referentie-peer.md"},{"id":"0019-surplus-doel-exclusieve-bestemming","title":"Surplus-doel = exclusieve bestemming (niet de volledige waterfall)","status":"aanvaard","date":"2026-06-16","elements":["as-planning","fn-toekomstplannen"],"summary":"Wanneer de gebruiker een pot-voorkeur (\"verdeling bij toename\") instelt, moet een surplus of liquidatie-opbrengst uitsluitend naar de gekozen pot gaan — niet pro-rata over alle asset-types worden verdeeld. De onttrekkings-volgorde (waterfall) houdt de brede, geordende verdeling.","file":"docs/adr/0019-surplus-doel-exclusieve-bestemming.md"},{"id":"0020-spaarquote-een-definitie-en-hypotheek-rentevrijval","title":"Spaarquote één definitie overal + rente-vrijval bij hypotheek-payoff","status":"aanvaard","date":"2026-06-16","elements":["as-budget","fn-budgetteren","as-planning","fn-toekomstplannen"],"summary":"De spaarquote heeft één definitie — `(inkomen − (uitgaven − spaarbudget) + aflossing) / inkomen` — die geldt op zowel het transactie-pad als het handmatige pad én op elke afnemer (dashboard, /toekomst, what-if, rapportage). In de FIRE-projectie valt na het volledig aflossen van e","file":"docs/adr/0020-spaarquote-een-definitie-en-hypotheek-rentevrijval.md"},{"id":"0021-sale-config-per-bezitting-en-in-loop-liquidatie","title":"Verkoop/liquidatie per niet-liquide bezitting via sale_config + default-on + in-loop on-demand","status":"aanvaard","date":"2026-06-16","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De verkoopkeuze voor een niet-liquide bezitting is een **first-class veld op de bezitting zelf** (`assets.sale_config`, JSONB). De engine besluit op grond van dit veld of en wanneer een asset wordt geliquideerd. De SSoT voor het of/wanneer verschuift daarmee van een `life_event` ","file":"docs/adr/0021-sale-config-per-bezitting-en-in-loop-liquidatie.md"},{"id":"0022-vrijheidscheck-publieke-intake","title":"Vrijheidscheck — publieke pre-account intake en conversie","status":"aanvaard","date":"2026-06-17","elements":["as-vrijheidscheck","sp-vrijheidscheck","b-bezoeker","do-lead","t-supabase"],"summary":"De publieke Vrijheidscheck-funnel (`/check`) laat een anonieme bezoeker een korte intake doen, krijgt server-side een Vrijheidsrapport berekend en converteert daarna naar een account. Omdat de bezoeker op dat moment nog niet in `auth.users` bestaat, loopt het schrijven via een se","file":"docs/adr/0022-vrijheidscheck-publieke-intake.md"},{"id":"0023-jaarruimte-wtp-30pct-correctie","title":"Jaarruimte-rekenmotor gecorrigeerd — 30% opbouw (WTP) + factor A × 6,27","status":"aanvaard","date":"2026-06-17","elements":["as-belasting"],"summary":"De jaarruimte-rekenmotor (`lib/jaarruimte.ts`, art. 3.127 Wet IB 2001) rekende fiscaal onjuist: een verouderd opbouwpercentage van 13,3% (verkeerd benoemd als `JAARRUIMTE_FACTOR_A`), mislabelde 2025-constanten en een rauwe euro-aftrek voor werkgeverspensioen. Dit besluit legt de ","file":"docs/adr/0023-jaarruimte-wtp-30pct-correctie.md"},{"id":"0024-integratie-contractbewaking","title":"Integratie-inventaris, liveness-probes en contractbewaking","status":"accepted","date":"2026-06-17","elements":["as-import","t-marktdata","t-bankimport","do-contract-events","app-comp"],"summary":"De app ondersteunt 14 externe koppelingen en uploads (brokers, exchanges, PSD2, marktdata, bestandsformaten). Dit besluit verankert de zelfactualiserende beheer-laag die die koppelingen bewaakt: een gecureerde inventaris (`lib/architecture/integrations-model.ts`), publieke livene","file":"docs/adr/0024-integratie-contractbewaking.md"},{"id":"0025-vrijheidscheck-eigen-woning-50pct-fire","title":"Vrijheidscheck — eigen woning telt voor 50% mee in de FIRE-grondslag","status":"aanvaard","date":"2026-06-17","elements":["as-vrijheidscheck","sp-vrijheidscheck"],"summary":"In de Vrijheidscheck-funnel (`/check`) telt de eigen woning voortaan voor **50%** van haar netto overwaarde mee in de FIRE-/vrijheidsberekening — inclusief 50% van het verwachte woning-rendement — i.p.v. volledig uitgesloten te worden. De implementatie is bewust **gescoped tot he","file":"docs/adr/0025-vrijheidscheck-eigen-woning-50pct-fire.md"},{"id":"0026-weergavemodus-eenvoudig-volledig","title":"Weergavemodus \"Eenvoudig ⇄ Volledig\" — server-side scalar pref + palet-commando","status":"aanvaard","date":"2026-06-22","elements":["do-meta","app-comp"],"summary":"TriFinity-pagina's hebben een \"diepte\"-laag (secundaire KPI's, detail-secties, uitleg) die voor beginners overweldigend is maar voor gevorderden waardevol. We willen één profiel-brede voorkeur die deze diepte-laag standaard inklapt (\"Eenvoudig\") of openzet (\"Volledig\"), cross-dev","file":"docs/adr/0026-weergavemodus-eenvoudig-volledig.md"},{"id":"0027-deplete-fire-detectie-liquide-ge-vnodig","title":"Deplete/pensioen-FIRE-detectie: liquide ≥ V_nodig (crossing met de referentielijn)","status":"aanvaard","date":"2026-06-23","elements":["as-planning","fn-toekomstplannen"],"summary":"De v2-grootboek-engine (`lib/horizon-engine/engine.ts`) bepaalt het FIRE-moment via `meetsStrategyTarget`. Voor de eindstrategie **deplete** (vermogen opeten) werd FIRE tot dit besluit gedetecteerd via een **forward feasibility-test**: de annuïteit-spend-down moest het volledige ","file":"docs/adr/0027-deplete-fire-detectie-liquide-ge-vnodig.md"},{"id":"0028-downsize-verkopen-spendable-salemanaged-verenigd","title":"Downsize \"Verkopen\": de woning is BÉIDE spendable (FIRE-eligible in de opbouw) ÉN saleManaged (verlaat de pot enkel via de verkoop)","status":"aanvaard","date":"2026-06-24","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De v2-grootboek-engine behandelde de woning bij housing-strategie **downsize** (\"Verkopen\") tot dit besluit als niet-liquide tot het verkoopmoment: ze telde NIET mee in het besteedbare/FIRE-eligible vermogen tijdens de opbouw. Dit besluit **herdefinieert** de bestaande `downsize`","file":"docs/adr/0028-downsize-verkopen-spendable-salemanaged-verenigd.md"},{"id":"0029-opeethypotheek-reverse-mortgage-grootboek","title":"Opeethypotheek (reverse mortgage) als echte grootboek-schuld in de V2-engine","status":"aanvaard","date":"2026-06-24","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De `reverse_mortgage` woningstrategie was in de V2-engine niet gemodelleerd: de engine kende enkel een recurring-payout-life-event (fictieve maanduitkering) en een display-only schaduwschuld buiten het grootboek. Dit besluit **modelleert de opeethypotheek volledig in het V2-groot","file":"docs/adr/0029-opeethypotheek-reverse-mortgage-grootboek.md"},{"id":"0030-drawdown-grondslag-besteedbaar-vermogen-splitst-rauwe-opname-van-fire-eligibility","title":"Drawdown-grondslag: besteedbaarVermogen splitst rauwe opname van FIRE-eligibility (Optie B)","status":"aanvaard","date":"2026-06-24","elements":["as-planning","fn-toekomstplannen"],"summary":"ADR 0028 verenigde `spendable` en `saleManaged` op de downsize-woning zodat ze al tijdens de opbouw als FIRE-eligible telde. Daarna trad een nieuw defect op bij `downsize` + `on_depletion`: de getoonde afbouwlijn dipte (~leeftijd 71), steeg vervolgens (~87) en crashte op endAge (","file":"docs/adr/0030-drawdown-grondslag-besteedbaar-vermogen-splitst-rauwe-opname-van-fire-eligibility.md"},{"id":"0031-downsize-verkooptrigger-hold-fire-anker-en-valuatie-basis","title":"Downsize-verkooptrigger: hold-FIRE-anker (geen vaste-punt-iteratie) + valuatie-basis","status":"aanvaard","date":"2026-06-25","elements":["as-planning","fn-toekomstplannen"],"summary":"Na ADR 0028 (de downsize-woning is `spendable` + `saleManaged`) en ADR 0030 (de FIRE-eligibility-pot `liquideVermogen` en de rauw-besteedbare pot `besteedbaarVermogen` zijn gesplitst) bleven twee defecten en één ontbrekende planningskeuze rond de eigen-huis-downsize over. Dit bes","file":"docs/adr/0031-downsize-verkooptrigger-hold-fire-anker-en-valuatie-basis.md"},{"id":"0032-horizon-kernel-excel-oracle-maandbasis","title":"Horizon-rekenkern volgt het eigen Excel-oracle: maandbasis, nominaal, parity ≤ €0,01","status":"aanvaard","date":"2026-07-02","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De eigenaar vervangt de rekenwijze achter de Horizon/Toekomst-grafiek door die van zijn eigen, gevalideerde Excel-model (**`Core calc v 0035-ai-privacy-consent.md"},{"id":"0036-partner-privacy-in-db-functie","title":"Partner-privacy wordt in de SECURITY DEFINER-functie zelf afgedwongen","status":"aanvaard","date":"2026-07-11","elements":["as-huishouden","do-huishouden"],"summary":"De partner-privacy-instelling `hidden` wordt afgedwongen **in de SECURITY DEFINER-DB-functies zelf**, niet bij elke afnemer apart. Concreet: `household_partner_totals()` gate't sinds migratie `20260711160000` de assets/debts-totalen per categorie via `get_partner_privacy_level` (","file":"docs/adr/0036-partner-privacy-in-db-functie.md"},{"id":"0037-post-fire-basissalaris-fire-gegate-bridge","title":"Post-FIRE basissalaris is een latent Excel-oracle-artefact — gegate in de bridge, niet in cf.ts","status":"accepted","date":"2026-07-12","elements":["as-planning","fn-toekomstplannen"],"summary":"`lib/horizon-kernel/bridge.ts` vertaalt de rauwe grootboek-rijen (`cf.ts`, de Excel-oracle-implementatie) naar `UnifiedProjectionRow.grossIncomeBySource` voor de app-consumers. De Excel-oracle (`CF!D`, het basissalaris-inkomen) loopt **onvoorwaardelijk door** — ook ná de FIRE-dat","file":"docs/adr/0037-post-fire-basissalaris-fire-gegate-bridge.md"},{"id":"0038-button-primitive-twee-varianten","title":"Button-primitive met twee gesanctioneerde CTA-varianten (ink-standaard + module-moment)","status":"accepted","date":"2026-07-13","elements":["app-comp","m-principes"],"summary":"De UX-review (`docs/ux-review-jul2026.md` §8, besluit 5) legt het knop-recept van TriFinity vast op **twee gesanctioneerde CTA-varianten** plus een secundaire outline, geïmplementeerd als één primitive `components/editorial/button.tsx`. Nieuwe CTA's lopen voortaan via deze compon","file":"docs/adr/0038-button-primitive-twee-varianten.md"},{"id":"0039-overlay-standaard-sticky-footer-pill","title":"Eén overlay-systeem — sticky footer-acties + automatisch verbergen van de nav-pill","status":"aanvaard","date":"2026-07-13","elements":["app-comp"],"summary":"De app krij projectie laat meebewegen met de portefeuil","file":"docs/adr/0042-flex-spending-must-nice-split.md"},{"id":"0043-lokale-transactiecategorisatie","title":"Lokale transactiecategorisatie (Gemma 4 E2B / WebGPU) — desktop-only assistief, ondanks NO-GO op de eigen ladder","status":"aanvaard","date":"2026-07-16","elements":["t-aigateway","as-import","do-meta","t-lokale-ai"],"summary":"Fase 0 (POC, `spikes/lokale-categorisatie/meetrapport-v1.md`) meet in-browser Gemma 4 E2B (Transformers.js/WebGPU) op de échte stage-1-residustaart uit op **~39% precisie bij ~52% dekking** (57% bij drempel ≥0,9, dan 12% dekking), 21% tegen menselijke labels, ~6,5 tok/s decode, ~","file":"docs/adr/0043-lokale-transactiecategorisatie-desktop-assistief.md"},{"id":"0044-api-error-envelope-respond-helper","title":"Gedeelde API-error-envelope + respond-helper als single source voor de HTTP-foutvorm; zod-conventie op nieuwe mutatie-routes","status":"aanvaard","date":"2026-07-17","elements":["t-platform","t-supabase"],"summary":"Over ~250 route-handlers onder `app/api/*` was er geen gedeelde foutvorm (enterprise-architectuurreview 3 jul 2026, bevinding #9 · fase F4):","file":"docs/adr/0044-api-error-envelope-respond-helper.md"},{"id":"0045-migratie-baseline-resync-en-drift-hek","title":"Documentaire baseline-migratie voor remote-only tabellen; werkwijze-hek tegen migratie-drift","status":"aanvaard","date":"2026-07-17","elements":["t-supabase"],"summary":"De live (remote) Supabase telde 74+ tabellen; de repo-migraties beschreven er ~56. 23 LIVE tabellen hadden geen tabeldefinitie in `supabase/migrations/*` (o.a. `recommendations`, `actions`, `budget_amounts`, `transaction_splits`, `bank_connections`, `user_own_ibans`, `error_logs`","file":"docs/adr/0045-migratie-baseline-resync-en-drift-hek.md"},{"id":"0046-netto-vermogen-historie-uitsplitsing-en-backfill","title":"Netto vermogen — verloop: bron-scheiding uitsplitsing vs. totaallijn, één gelabelde restband en twee onafhankelijke bewerkingsniveaus", unt.md"},{"id":"0057-eigen-leaked-password-check","title":"Eigen leaked-password-protection via HaveIBeenPwned k-anonimiteit (gratis, UI-grade)","status":"aanvaard","date":"2026-07-20","elements":["t-supabase","app-comp"],"summary":"De drie auth-flows (signup, reset-password, account-wachtwoord) controleren een gekozen wachtwoord tegen de HaveIBeenPwned \"Pwned Passwords\"-range-API vóór de `supabase.auth.*`-call. De check draait via **k-anonimiteit**: de browser hasht het wachtwoord lokaal (SHA-1), stuurt all","file":"docs/adr/0057-eigen-leaked-password-check.md"},{"id":"0058-datapad-conventie-lezen-muteren-client-direct","title":"Datapad-conventie — lezen via loader/bundel, muteren via API-route, client-direct afgebakend","status":"aanvaard","date":"2026-07-21","elements":["app-comp","t-supabase","data-cont"],"summary":"De frontend leest weergavedata voortaan **alléén** via een server-loader (`lib/*-data-loader.ts` → `DashboardData`-bundel → props) en muteert **alléén** via een API-route met de error-envelope (ADR 0044) + zod (`parseBody`). Rechtstreeks de browser-client (`lib/supabase/client`) ","file":"docs/adr/0058-datapad-conventie-lezen-muteren-client-direct.md"},{"id":"0059-avg-bewaartermijnen-en-wissing","title":"AVG-rechten afmaken — bewaartermijnen, volledige wissing/reset, export en FK-anonimisering","status":"aanvaard","date":"2026-07-21","elements":["t-supabase","app-comp"],"summary":"De AVG-rechten (verwijderen, reset, dataportabiliteit, bewaartermijnen) worden sluitend gemaakt met één datamodel-single-source (`lib/user-data-tables.ts`), een FK-ON-DELETE-hardening (migratie `20260721140000`), een volledige alles-in-één JSON-export en een dagelijkse retentie-c","file":"docs/adr/0059-avg-bewaartermijnen-en-wissing.md"},{"id":"0060-server-observability-instrumentation-en-cron-alert","title":"server observability instrumentation en cron alert","status":"accepted","date":"2026-07-21","elements":["t-platform","t-supabase","app-comp"],"summary":"De parallelle sessie (ADR 0063, destijds genummerd 0056) landde CLIENT-observability (web-vitals/RUM). SERVER-observability had gaten: onafgevangen server-fouten (Server Components / Route Handlers / Server Actions die niet via `serverError()` lopen) landden alleen in Vercel-logs","file":"docs/adr/0060-server-observability-instrumentation-en-cron-alert.md"},{"id":"0061-lokaal-actievoorstel-tool-calling-substituut","title":"C2c: lokaal tekst-geparst actievoorstel als tool-calling-substituut","status":"aanvaard","date":"2026-07-25","elements":["t-lokale-ai","as-coach"],"summary":"De lokale (on-device) Fin-chat kan een gestructureerd actievoorstel emitten als een fenced tekstblok (` ```fin-actie `) in zijn antwoord. Dit is GEEN autonome function-invocation — LiteRT-LM JS heeft geen tool-calling-API — maar een tekst-intent die fail-closed geparst wordt, alt","file":"docs/adr/0061-lokaal-actievoorstel-tool-calling-substituut.md"},{"id":"0062-lokale-chat-dna-afgeleid-artefact","title":"Lokale chat-DNA wordt een afgeleid, hash-geverifieerd artefact","status":"aanvaard","date":"2026-07-25","elements":["t-lokale-ai"],"summary":"`LOCAL_CHAT_DNA` (`lib/ai/local/local-chat-prompt.ts`) is niet langer een hand-onderhouden verbatim-kopie van de cloud-prompt-DNA. Het wordt via de `lokale-prompt-parity`-skill en een gecommit manifest (`lib/ai/local/parity-manifest.json`) gesynchroniseerd met de cloud-bron (`lib","file":"docs/adr/0062-lokale-chat-dna-afgeleid-artefact.md"},{"id":"0063-eigen-web-vitals-rum-collectie","title":"eigen web vitals rum collectie","status":"accepted","date":"2026-07-20","elements":["t-platform","t-supabase","app-comp"],"summary":"> Was abusievelijk genummerd 0056 (botste met `0056-chat-transport-cloud-lokaal-omschakelpunt.md`); hernummerd naar 0063 op 2026-07-28. Verwijzingen naar \"ADR 0056\" over RUM/web-vitals bedoelen dit besluit.","file":"docs/adr/0063-eigen-web-vitals-rum-collectie.md"},{"id":"0064-aow-bedragen-ssot-en-kernel-input-injectie","title":"AOW-bedragen: één bron in constants.ts, de kernel krijgt de basis als INPUT (oracle-fallback blijft)","status":"aanvaard","date":"2026-07-29","elements":["as-planning","fn-toekomstplannen","as-vermogen"],"summary":"De app toonde en berekende de AOW op **twee grondslagen tegelijk**. Dit besluit maakt `lib/constants.ts` de enige bron van de AOW-bedragen — óók voor de FIRE-projectie — en legt vast hóe de horizon-kernel die bron consumeert zonder het Excel-oracle-contract (ADR 0032) te breken.","file":"docs/adr/0064-aow-bedragen-ssot-en-kernel-input-injectie.md"},{"id":"0065-landingspagina-blijft-in-fin-first","title":"Landingspagina en publieke funnel blijven in fin-first (geen aparte marketing-repo)","status":"aanvaard","date":"2026-07-29","elements":["as-vrijheidscheck","b-bezoeker","t-platform"],"summary":"Org-besluit 01 (`trifinity-org/org_plan/60-besluiten.md`), hier vastgelegd zodat de vraag niet elk kwartaal terugkomt.","file":"docs/adr/0065-landingspagina-blijft-in-fin-first.md"},{"id":"0066-repo-topologie-skills-op-schijf-deploy-op-push","title":"Repo-topologie: twee repo''s naast elkaar, Claude-skills direct op schijf, deploy-op-push als releasemodel","status":"aanvaard","date":"2026-07-29","elements":["t-platform","app-comp"],"summary":"Org-besluiten 03, 06 en 07 (`trifinity-org/org_plan/60-besluiten.md`) in één ADR — het eerste besluitdocument over repo-opzet en deployment-topologie.","file":"docs/adr/0066-repo-topologie-skills-op-schijf-deploy-op-push.md"},{"id":"0067-vrijheidscheck-uitkomst-deelbaar-zonder-bedragen","title":"De Vrijheidscheck-uitkomst wordt deelbaar — uitsluitend vrijheidstijd, nooit bedragen of invoer","status":"aanvaard","date":"2026-07-29","elements":["as-vrijheidscheck","sp-vrijheidscheck","b-bezoeker"],"summary":"Org-besluit 08 (`trifinity-org/org_plan/60-besluiten.md`). Ontwerpbesluit vooraf, zodat de bouw (nog niet gestart) binnen deze grens blijft.","file":"docs/adr/0067-vrijheidscheck-uitkomst-deelbaar-zonder-bedragen.md"},{"id":"0068-leads-bewust-niet-opvolgen-tot-f1","title":"Vrijheidscheck-leads worden bewust níet opgevolgd tot F1 — verdamping is een keuze, geen lek","status":"aanvaard","date":"2026-07-29","elements":["do-lead","as-vrijheidscheck","b-bezoeker"],"summary":"Org-besluit 09 (`trifinity-org/org_plan/60-besluiten.md`), het blokkerende grondslag-besluit van werkstroom 10.","file":"docs/adr/0068-leads-bewust-niet-opvolgen-tot-f1.md"}],"churn":{"sinceDays":90,"areas":[{"path":"app/(app)/overzicht","commits":107},{"path":"lib/ai","commits":55},{"path":"app/(app)/toekomst","commits":40},{"path":"app/api/ai","commits":19},{"path":"app/api/household","commits":15},{"path":"lib/horizon-data.ts","commits":10},{"path":"lib/fire-simulation.ts","commits":8},{"path":"app/api/budgets","commits":5},{"path":"app/api/assets","commits":5},{"path":"components/horizon","commits":3}],"hotFiles":[{"file":"components/app/horizon/horizon-client.tsx","loc":8281,"commits":91},{"file":"components/app/budgets-client.tsx","loc":5082,"commits":34},{"file":"components/core/assets-client.tsx","loc":4312,"commits":45},{"file":"components/app/cash-account-view.tsx","loc":2785,"commits":16},{"file":"lib/release-notes.ts","loc":2763,"commits":3},{"file":"lib/dashboard-data-loader.ts","loc":2646,"commits":49},{"file":"lib/test-personas.ts","loc":2216,"commits":12},{"file":"app/(app)/core/checkin/page.tsx","loc":2205,"commits":10}]},"claudeTeam":{"agents":[{"id":"ai-specialist-general","name":"ai-specialist-general","description":"Use this agent for any general AI/LLM integration work in TriFinity: wiring up or reviewing AI features that use the Vercel AI SDK (the `ai` package), the multi-provider model config in `lib/ai/config.ts` (Anthropic default, plus OpenAI/Mistral/Ollama), streaming chat, tool calling (`lib/ai/tools/`), structured outputs with zod schemas (`lib/ai/schemas/`), context building (`lib/ai/context/`), token/usage logging (`lib/ai/token-usage.ts`), guardrails (`lib/ai/sanitize.ts`, `lib/ai/pii-output-filter.ts`), the kill-switch/tier gating, and the AI API routes under `app/api/ai/*`. Prompt wording and the per-domain personality DNA itself belong to the `ai-specialist-prompt-dna` agent — this agent owns the plumbing AROUND the prompts.","model":"opus","color":"cyan"},{"id":"ai-specialist-prompt-dna","name":"ai-specialist-prompt-dna","description":"Use this agent for anything about the WORDING and BEHAVIOUR of the prompts TriFinity sends to the LLM — the app's prompt 'DNA'. This is the agent that owns how De Wil (and Kern/Horizon) talks and reasons: the system prompts in `lib/ai/dna/` (base + per-domain personalities), the task prompts like transaction categorization (`lib/ai/categorize-system-prompt.ts`), extraction (`lib/ai/extraction-system-prompt.ts`), subscription detection, pension parsing, what-if suggestions, and the budget-categorization quality (does a transaction land on the RIGHT budget?). Use it to write, tune, debug, or review any prompt; the surrounding plumbing (SDK, providers, tools, routes) belongs to the `ai-specialist-general` agent.","model":"opus","color":"teal"},{"id":"architect","name":"architect","description":"Use this agent as the Enterprise & Solution Architect for TriFinity: the owner of the structural blueprint and architectural decisions, and the person accountable that the in-app architecture plates (`/beheer/architectuur` — Praatplaat/HLD, ArchiMate, Database/ERD, Berekeningen) stay truthful. He works at TWO moments: (1) at the START of a new feature — solution design, how it fits the enterprise architecture, the principles/trade-offs and the ADR; and (2) as a REVIEWER of structure — does this change respect the architecture, the domains, the single-source-of-truth and the documented decisions? He owns architectural CONTENT and DECISIONS; the mechanical doc-sync is delegated to `architecture-docs-keeper`, and code-level direction and code-level review to `senior-developer`/`code-review`.","model":"opus","color":"pink"},{"id":"architecture-docs-keeper","name":"architecture-docs-keeper","description":"Use this agent to keep TriFinity's self-documenting architecture page (`/beheer/architectuur`) in sync with code changes. It owns the curation behind the four views — Praatplaat (HLD), Plaat (ArchiMate), Database (ERD) and Berekeningen — and the rule from CLAUDE.md: 'laat de documentatie beter achter dan je 'm vond'. Use it whenever a domain, module, table, calculation, integration or capability is added/removed/renamed, when ADRs or concerns need recording, or to review whether an architecture change kept the docs consistent.","model":"sonnet","color":"blue"},{"id":"bug-reporter","name":"bug-reporter","description":"Use this agent to turn a vague problem report into a complete, reproducible bug report for TriFinity. It does NOT fix the bug — it investigates and documents: a clear title, environment/context, exact steps to reproduce, expected vs. actual behaviour, the affected use cases/user journeys, severity & impact, suspected area in the codebase, and the evidence behind it. Use it whenever a bug is observed or reported and you want a crisp, actionable write-up before anyone starts fixing.","model":"sonnet","color":"red"},{"id":"business-owner","name":"business-owner","description":"Use this agent for product/business-owner thinking on TriFinity: deciding what to build and why, shaping and prioritizing the backlog, writing clear feature definitions, and judging whether a proposed change serves the product's mission and philosophy ('Geld is opgeslagen tijd'). It owns the feature-management MCP tools (feature_create, feature_create_bulk, feature_skip, feature_get_stats, feature_get_ready, feature_get_blocked, feature_get_by_id). Use it to turn a vague idea into well-scoped features, to challenge scope/priority, to assess value and risk (incl. Wft-compliance and trust), and for the user-facing 'is this worth doing?' call.","model":"sonnet","color":"amber"},{"id":"calc-engine-specialist","name":"calc-engine-specialist","description":"Use this agent for TriFinity's financial calculation engines (rekenmotoren): the code that turns raw DB data into the derived numbers users see — spaarquote, netto vermogen, belastingdruk (box 1/box 3), FIRE-doel, vrijheids-% and vrijheidstijd. It owns `lib/horizon-kernel/**` (the FIRE/Horizon engine: engine/solver/gap/bridge/run-unified/wrappers/adapter), `lib/horizon/build-input.ts`, `lib/horizon/networth-rows.ts`, `lib/constants.ts`, `lib/fire-params.ts`, `lib/budget-utils.ts`, `lib/effective-financials.ts`, `lib/savings-source.ts`, `lib/housing-strategy.ts`, `lib/box1-tax.ts`, `lib/box3-data.ts`, `lib/dashboard-data-loader.ts` and `lib/format.ts`; `lib/unified-projection.ts` is only the consumer type contract (SimRow/SimResult) produced by the kernel bridge — not an engine. Use it whenever a calculation, constant or assumption changes, or to verify a number is correct and single-sourced. It also keeps the curated *Berekeningen* view (`lib/architecture/calculations.ts`) in sync.","model":"opus","color":"amber"},{"id":"code-review","name":"code-review","description":"Use this agent when you need a thorough code review of recently written code, when you want to ensure code quality meets the highest standards, when checking for technical debt, security vulnerabilities, or performance issues, or when you need to run quality checks like linting and type checking.","model":"opus","color":"red"},{"id":"coder","name":"coder","description":"Use this agent when you need to implement new features, write new code, refactor existing code, or make any code changes to the codebase. This agent should be invoked for tasks requiring high-quality, production-ready code implementation.\\ \\","model":"opus","color":"orange"},{"id":"deep-dive","name":"deep-dive","description":"Use this agent for a deep second opinion before a critical or hard-to-reverse decision, and for research that reaches beyond the codebase — comparing solution approaches, library/API research via the web, multi-source verification of assumptions. It complements the specialists, it does not replace them: bug investigation → bug-reporter, security audit → security-specialist, quick codebase lookup → Explore, solution design → architect. Pipelines may also dispatch it explicitly for deep pre-work analysis (e.g. understanding current behaviour before extending a feature).","model":"opus","color":"purple"},{"id":"frontend-ui-builder","name":"frontend-ui-builder","description":"Use this agent to BUILD new TriFinity UI: pages and React components in the established Next.js 16 / React 19 / Tailwind v4 style — module heroes, KPI stat cards, BottomSheet deep-dives, charts — always with the 'Geld is opgeslagen tijd' framing and correct feature/module gating. It writes components; the separate `ux-review-expert` agent reviews them. Use it when a new screen, widget, modal or component is needed, or when restyling existing UI to match the design system.","model":"opus","color":"purple"},{"id":"polar-payments-expert","name":"polar-payments-expert","description":"Use this agent when implementing, reviewing, or troubleshooting the Polar (polar.sh) payment integration — checkout flows, webhooks, subscriptions, product/price mapping. TriFinity is UI-first: the subscription catalog lives in lib/subscription-catalog.ts (Pro + add-ons, available:false until Polar goes live) and /mijn/account renders it; this agent owns the seam where that catalog meets real Polar checkout/webhooks.","model":"opus","color":"green"},{"id":"requirement-specialist","name":"requirement-specialist","description":"Use this agent to turn a business-owner intent into precise, unambiguous requirements and acceptance criteria for TriFinity — the bridge between 'what we want and why' (business-owner) and 'how we build it' (engineers). It works on behalf of the business-owner to set the right expectations: it elaborates a feature into clear functional & non-functional requirements, explicit acceptance criteria (Given/When/Then), scope boundaries (in/out), edge cases, dependencies, and the definition of done — without deciding priority (that's the business-owner) or implementation (that's the engineers). Use it after an idea is greenlit and before building, or when a feature's expectations are fuzzy and need pinning down.","model":"sonnet","color":"amber"},{"id":"security-specialist","name":"security-specialist","description":"Use this agent for application-security and privacy review in TriFinity: auditing new/changed API routes, service-role usage, secrets/keys, dev/test endpoints, partner/household privacy, AI data-exposure and Wft/AVG-sensitive surfaces. Use it as the security gate in the feature/bug pipelines, before shipping any change that touches data access, auth, external calls or admin paths — and for periodic security sweeps of the whole app. RLS/schema mechanics belong to `supabase-db-specialist`; this agent owns the security view ACROSS layers (route → proxy → client → AI → DB).","model":"opus","color":"red"},{"id":"senior-developer","name":"senior-developer","description":"Use this agent as the senior/principal engineer for TriFinity: code-level technical direction, tricky cross-cutting refactors, hard debugging, and final technical judgement that spans multiple domains (Next.js 16, React 19, Supabase/RLS, AI, the calc engines, the self-documenting architecture). It coordinates the specialist agents, weighs trade-offs, and owns codebase-wide quality and consistency. Boundary: structural/domain decisions, enterprise fit and ADRs belong to the `architect` agent — this agent owns how it gets built well. Use it when a change touches several subsystems, needs a build/refactor plan, or when you want a seasoned 'is this the right approach?' call before committing.","model":"opus","color":"red"},{"id":"supabase-db-specialist","name":"supabase-db-specialist","description":"Use this agent for any Supabase / PostgreSQL database work in TriFinity: writing or reviewing SQL migrations in `supabase/migrations/*`, designing tables, foreign keys, indexes, RPCs/functions, and — above all — Row Level Security (RLS) policies and ownership (gebruiker vs. huishouden). Use it whenever a schema change, a new table, an RLS policy, a service-role write path, or a data-access question comes up. It guards that every new table is RLS-correct, scoped to the right owner, and that the ERD/architecture stays in sync.","model":"opus","color":"green"},{"id":"tester","name":"tester","description":"Use this agent to write, run, debug and review tests for TriFinity, and to verify that a change actually works before it's called done. It owns the two test layers: unit/component tests with Vitest (`*.test.ts` / `*.test.tsx`, run via `npm run test:run`) and the in-app regression framework (`lib/regression-tests/suites/*` — 80+ suites, registered via `registerTest`/`registerCategory`). Use it after any non-trivial change, when coverage is missing, when a bug needs a reproducing test, or when tests are failing and need diagnosis.","model":"sonnet","color":"green"},{"id":"uat-docs-keeper","name":"uat-docs-keeper","description":"Use this agent to keep TriFinity's UAT definitions (lib/uat/**) in sync with code changes — the acceptance criteria (Given/When/Then), the scenario/zone catalog and the process-flow graphs. It is the UAT twin of `architecture-docs-keeper`: it UPDATES and ADDS definitions to match what the code now does, but it NEVER executes the live UAT run (that is the `/uat` command, when a zone is tested again). Use it in the release pipeline's UAT-sync gate, or while building a feature, whenever a change touches a tested zone's behaviour or user-facing surface.","model":"sonnet","color":"green"},{"id":"ux-review-expert","name":"ux-review-expert","description":"Use this agent when the user wants a UI/UX review of recently written or modified code, when consistency issues need to be identified across components, when new UI components are being designed or implemented, or when the user asks for feedback on user experience, visual design, interaction patterns, or accessibility. This agent should be proactively invoked after any significant UI change is made.\\ \\","model":"sonnet","color":"purple"}],"skills":[{"id":"ai-feature","name":"ai-feature","description":"Pijplijn voor het bouwen of wijzigen van AI-FUNCTIONALITEIT in TriFinity — nieuwe AI-routes, tools, structured outputs, context-builders of provider/config-wijzigingen. Gebruik deze skill voor 'de app moet iets nieuws met AI kunnen' — óók voor uitbreiding van bestaande AI-functionaliteit (AI-plumbing wint van /extend-feature); voor hoe de AI zich gedraagt of antwoordt, gebruik /ai-gedrag.","steps":[{"index":1,"title":"Waarde & compliance","agents":["business-owner"]},{"index":2,"title":"Verwachtingen","agents":["requirement-specialist"]},{"index":3,"title":"Architectuur-fit","agents":["architect"]},{"index":4,"title":"Bouwen","agents":["ai-specialist-general","supabase-db-specialist","calc-engine-specialist","frontend-ui-builder"]},{"index":5,"title":"Prompt erbij","agents":["ai-specialist-prompt-dna"]},{"index":6,"title":"Testen","agents":["tester"]},{"index":7,"title":"Review","agents":["code-review","security-specialist"]},{"index":8,"title":"Platen","agents":["architecture-docs-keeper","architect"]}]},{"id":"ai-gedrag","name":"ai-gedrag","description":"Pijplijn voor het bijsturen van AI-GEDRAG in TriFinity — hoe De Wil (en Kern/Horizon) praat, redeneert, categoriseert en antwoordt. Gebruik bij verkeerde categorisaties, toon/lengte-problemen, filosofie-drift, compliance-zorgen of het verfijnen van een bestaande prompt — ook wanneer zoiets als 'bug' gemeld wordt. Voor nieuwe AI-functionaliteit gebruik je /ai-feature; deze skill gaat over hoe de bestaande AI zich gedraagt.","steps":[{"index":1,"title":"Gedrag vastleggen met voorbeelden","agents":["bug-reporter"]},{"index":2,"title":"Gewenst gedrag definiëren","agents":["requirement-specialist","business-owner"]},{"index":3,"title":"Diagnose & aanpassing","agents":["ai-specialist-prompt-dna","business-owner","ai-specialist-general"]},{"index":4,"title":"Regressiebewijs","agents":["tester"]},{"index":5,"title":"Gedragsreview","agents":["code-review"]},{"index":6,"title":"Borging","agents":["architect"]}]},{"id":"avg-verzoek","name":"avg-verzoek","description":"Gebruik wanneer iemand vraagt om inzage, export, verwijdering of correctie van zijn persoonsgegevens — per support-mail, in een gesprek, of hoe dan ook geformuleerd (\"mag ik mijn data?\", \"verwijder mijn account maar\"). Ook bij twijfel of iets een AVG-verzoek is; behandel het dan als verzoek. Start de 30-dagenklok, stelt de identiteit vast en handelt af via de bestaande export- en verwijder-API.","steps":[]},{"id":"bug-fix","name":"bug-fix","description":"Bug-fix pijplijn voor TriFinity. Gebruik wanneer een defect gemeld of waargenomen is — 'werkt niet', 'klopt niet', crash, verkeerd getal. NIET voor AI-gedragsafwijkingen (verkeerde categorisatie, toon of antwoorden van de AI) → /ai-gedrag.","steps":[{"index":0,"title":"Fast-path-poort","agents":[]},{"index":1,"title":"Rapporteren & reproduceren","agents":["bug-reporter"]},{"index":2,"title":"Verwachting vastleggen","agents":["requirement-specialist"]},{"index":3,"title":"Architectuur-impact triage","agents":["architect"]},{"index":4,"title":"Falende test vastleggen","agents":["tester"]},{"index":5,"title":"Fixen via de juiste specialist","agents":["senior-developer","calc-engine-specialist","supabase-db-specialist","ai-specialist-general","ai-specialist-prompt-dna","frontend-ui-builder","coder"]},{"index":6,"title":"Verifiëren","agents":["tester"]},{"index":7,"title":"Review","agents":["code-review","ux-review-expert","security-specialist"]},{"index":8,"title":"Architectuur-fit & platen","agents":["architect","architecture-docs-keeper"]}]},{"id":"compliance-check","name":"compliance-check","description":"Gebruik vóór elke publicatie van publieke tekst (landing, SEO-pagina, funnel, social post, deelbaar asset), vóór elke wijziging aan prompt-DNA of AI-gedrag, bij elk /nieuws- of briefing-item dat over keuzes met geld gaat, en bij elke nieuwe claim over veiligheid, opslag of rendement. Toetst aan de Wft-grens (inzicht mag, vergunningsplichtig advies niet) en de claimlijst, en levert een beslisbare uitkomst — goedkeuren, aanpassen of afwijzen.","steps":[]},{"id":"datalek-72u","name":"datalek-72u","description":"Gebruik bij elk vermoeden van een datalek — een signaal dat persoonsgegevens gezien, gewijzigd of meegenomen kunnen zijn door iemand die dat niet mocht. Ingangen; een melding van buiten (support-mail), een incident uit het incidentprotocol, verdachte toegang in logs, of een kwijtgeraakt apparaat. Beoordeelt, damt in en meldt binnen 72 uur bij de AP; legt óók niet-gemelde lekken vast in het meldregister.","steps":[]},{"id":"extend-feature","name":"extend-feature","description":"Pijplijn voor het UITBOUWEN van een BESTAANDE functionaliteit in TriFinity — een delta op iets dat al werkt. Gebruik deze skill wanneer een bestaande functie uitgebreid of verdiept moet worden (niet nieuw, niet een bug; kleine bijschaving zonder nieuw gedrag van betekenis → /kleine-aanpassing; AI-functionaliteit → /ai-feature).","steps":[{"index":1,"title":"Huidige werking in kaart","agents":["deep-dive"]},{"index":2,"title":"Waarde van de uitbreiding","agents":["business-owner"]},{"index":3,"title":"Delta-requirements","agents":["requirement-specialist"]},{"index":4,"title":"Impact- & fit-review","agents":["architect"]},{"index":5,"title":"Plan met minimale blast radius","agents":["senior-developer"]},{"index":6,"title":"Bouwen","agents":["supabase-db-specialist","calc-engine-specialist","ai-specialist-general","ai-specialist-prompt-dna","frontend-ui-builder","coder"]},{"index":7,"title":"Testen","agents":["tester"]},{"index":8,"title":"Review","agents":["code-review","ux-review-expert","security-specialist"]},{"index":9,"t // ── diff banner ───────────────────────────────────────────────────────────
function diffBanner() {
  const d = DATA.diff || {};
  if (d.baseline) return `<div class="diff"><h3>Wat is er veranderd</h3><div class="note">Eerste snapshot vastgelegd — vanaf de volgende run verschijnen hier de dagelijkse wijzigingen.</div></div>`;
  if (!d.hasChanges) return `<div class="diff"><h3>Wat is er veranderd</h3><div class="note">Geen wijzigingen sinds ${esc(d.previousDate || 'de vorige run')}.</div></div>`;
  const rows = d.sections.map((sec) => {
    const parts = [];
    if (sec.added && sec.added.length) parts.push(`<span class="tag-add">+${sec.added.length}</span> ${sec.added.map((x) => `<span class="pill-mini">${esc(x)}</span>`).join('')}`);
    if (sec.removed && sec.removed.length) parts.push(`<span class="tag-rem">−${sec.removed.length}</span> ${sec.removed.map((x) => `<span class="pill-mini">${esc(x)}</span>`).join('')}`);
    return `<li><b>${esc(sec.label)}</b> — ${parts.join(' &nbsp; ')}</li>`;
  }).join('');
  return `<div class="diff changed"><h3>Wat is er veranderd sinds ${esc(d.previousDate || '')}</h3><ul>${rows}</ul></div>`;
}

function routeItem(r) {
  const search = ds(r.url + ' ' + r.file);
  return `<li class="item" data-search="${search}" data-test="${r.isTest ? 1 : 0}">
    <code>${esc(r.url)}</code>${r.isTest ? ' <span class="badge-test">test</span>' : ''}
    <span class="file">${esc(r.file.replace(/^app\//, ''))}</span></li>`;
}
function apiItem(r) {
  const search = ds(r.url + ' ' + (r.methods || []).join(' '));
  const methods = (r.methods || []).map((m) => `<span class="m ${m}">${m}</span>`).join('');
  return `<li class="item" data-search="${search}" data-test="0">
    <span class="methods">${methods || '<span class="m OPTIONS">?</span>'}</span>
    <code>${esc(r.url)}</code></li>`;
}

}

    const c = p.coach || {};
    const layers = (c.layers || []).map((l) => `<div class="coach-layer"><b>${esc(l.label)}</b> — ${esc(l.description)}</div>`).join('');
    const gaps = (c.dataGapSignals || []).length ? instanceBlock('Data-gap-signalen (' + c.dataGapSignals.length + ')', `<div class="chips">${c.dataGapSignals.map((g) => `<span class="chip" data-search="${ds(g)}">${esc(g)}</span>`).join('')}</div>`) : '';
    inst = `<div class="inst"><div class="ilab">Vier prioriteitslagen</div>${layers}</div>${gaps}`;
  } else if (m.id === 'briefing-tools') {
    const t = (p.briefing && p.briefing.tools) || [];
    inst = instanceBlock('Kaart-tools (' + t.length + ')', `<div class="chips">${t.map((x) => `<span class="chip" data-search="${ds(x)}">${esc(x)}</span>`).join('')}</div>`);
  }
  return `<div class="mech">
    <div class="mh">${esc(m.title)}</div>
    <div class="mfile">${esc(m.file)}</div>
    <div class="msum">${esc(m.summary)}</div>
    ${inst}
    ${m.extend ? `<div class="mext"><b>Uitbreiden:</b> ${esc(m.extend)}</div>` : ''}
  </div>`;
}
function domainBand() {
  const mechs = (A.mechanisms || []).map(mechCard).join('');
  const mods = (DATA.modules && DATA.modules.modules) || [];
  const modChips = `<div class="chips">${mods.map((m) => `<span class="chip" data-search="${ds(m.id + ' ' + m.label)}"><b>${esc(m.label)}</b> · ${esc(m.id)}</span>`).join('')}</div>`;
  const phases = (DATA.phases && DATA.phases.phases) || [];
  const phaseColors = { recovery: '#9f1239', stability: '#1d4ed8', momentum: '#0f766e', mastery: '#b45309' };
  const phaseBar = `<div class="phases">${phases.map((p) => `<div class="phase" style="background:${phaseColors[p.id] || '#555'}"><div class="pl">${esc(p.label)}</div><div class="plv">niveau ${esc((p.levels || []).join(', '))}</div></div>`).join('')}</div>`;
  return band('domain', 'l3', '3', 'Domein & AI', A.layers && A.layers.domain, `
    <div class="mech-intro">${esc(A.mechanismsIntro || '')}</div>
    <div class="mechs">${mechs}</div>
    <div class="section-h">Functionele modules · ${mods.length}</div>
    ${modChips}
    <div class="section-h">Soevereiniteitsniveaus → fasen · ${phases.length}</div>
    ${phaseBar}
  `);
}

// ── L4 data ──────────────────────────────────────────────────────────────────
function dataBand() {
  const doms = (DATA.tablesByDomain || []).map((d) =>
    acc(d.domain, d.tables.length, `<div class="chips">${d.tables.map((t) => `<span class="chip" data-search="${ds(t.name)}">${esc(t.name)}</span>`).join('')}</div>`)).join('');
  const intro = `<div class="note" style="margin-bottom:12px">${DATA.stats.tables} tabellen · ${DATA.stats.migrations} migraties · Supabase Postgres met RLS & realtime.</div>`;
  return band('data', 'l4', '4', 'Data-laag', A.layers && A.layers.data, intro + doms);
}

// ── L5 integrations ───────────────────────────────────────────────────────────
function integrationsBand() {
  const byCat = {};
  for (const i of DATA.integrations || []) (byCat[i.category] ??= []).push(i);
  const cards = Object.entries(byCat).map(([cat, items]) =>
    `<details class="card" open><summary>${chevron()}<span class="sumlabel">${esc(cat)}</span><span class="sumcount">${items.length}</span></summary>
     <div class="body"><div class="chips">${items.map((i) => `<span class="chip" data-search="${ds(i.name + ' ' + cat)}">${esc(i.name)}</span>`).join('')}</div></div></details>`).join('');
  return band('int', 'l5', '5', 'Integraties', A.layers && A.layers.integrations, `<div class="grid2">${cards}</div>`);
}

// ── building blocks ────────────────────────────────────────────────────────
function acc(label, count, bodyHtml) {
  return `<details class="acc"><summary>${chevron()}<span class="sumlabel">${label}</span><span class="sumcount">${count}</span></summary><div class="body">${bodyHtml}</div></details>`;
}
function band(anchor, accentVar, num, title, desc, bodyHtml) {
  return `<section class="band" id="l-${anchor}" style="--accent:var(--${accentVar})">
    <div class="band-rail"><span class="bar"></span><span class="num">Laag ${num}</span><h2>${esc(title)}</h2><p>${esc(desc || '')}</p></div>
    <div class="band-body">${bodyHtml}</div>
  </section>`;
}

// ── footer ────────────────────────────────────────────────────────────────
function footer() {
  const pr = (A.principles || []).map((p) => `<div class="principle">${esc(p)}</div>`).join('');
  return `<footer>
    <div class="section-h">Ontwerpprincipes</div>
    <div class="principles">${pr}</div>
    <div class="howto">
      <strong>Hoe deze plaat wordt onderhouden.</strong> De feiten worden automatisch uit de code gelezen; het verhaal staat in <code>scripts/architecture/annotations.mjs</code>. Regenereren: <code>npm run arch:diagram</code>. Een dagelijkse taak draait dit en toont bovenaan wat er veranderde.
    </div>
  </footer>`;
}

// ── render + interactions ───────────────────────────────────────────────────
document.getElementById('app').innerHTML =
  header() + diffBanner() + toolbar() +
  frontendBand() + apiBand() + domainBand() + dataBand() + integrationsBand() + footer();

const q = document.getElementById('q');
const empty = document.getElementById('empty');
const showTest = document.getElementById('showTest');

showTest.addEventListener('change', () => {
  document.body.classList.toggle('hide-test', !showTest.checked);
  applyFilter();
});

let t;
q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(applyFilter, 90); });

function applyFilter() {
  const term = q.value.trim().toLowerCase();
  const items = document.querySelectorAll('[data-search]');
  let anyVisible = false;
  items.forEach((el) => {
    const isTestHidden = el.matches('li.item[data-test="1"]') && document.body.classList.contains('hide-test');
    const match = !term || el.getAttribute('data-search').includes(term);
    const visible = match && !isTestHidden;
    el.classList.toggle('filtered-out', !match);
    el.style.display = visible ? '' : (match ? 'none' : 'none');
    if (visible) anyVisible = true;
  });
  // open/close groups based on visible descendants; show empty note
  document.querySelectorAll('details.acc, details.card, details.mod').forEach((d) => {
    const vis = [...d.querySelectorAll('[data-search]')].some((el) => el.style.display !== 'none' && !(el.matches('li.item[data-test="1"]') && document.body.classList.contains('hide-test')));
    d.style.display = (term && !vis) ? 'none' : '';
    if (term && vis) d.open = true;
  });
  empty.style.display = (term && !anyVisible) ? 'block' : 'none';
}

applyFilter();
</script>
</body>
</html>
