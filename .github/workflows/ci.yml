name: CI

# Kwaliteitspoort (enterprise-architectuurreview 3 jul 2026, bevinding #2,
# fase F2). De rekenkern is uitzonderlijk goed getest — Excel-oracle-pariteit
# tot ≤ €0,01, ~1.190 engine-tests — maar niets dwong die tests af: geen CI,
# en de husky pre-push draait alleen `tsc` met testbestanden uitgefilterd.
# Deze workflow dwingt de typecheck én de zwaarst-gewogen rekenmotor-tests
# af bij elke push en pull request, zodat een rekenregressie niet ongemerkt
# gemerged kan worden.

on:
  push:
    branches: ['**']
  pull_request:

# Een nieuwe push op dezelfde ref annuleert een nog lopende run: snellere
# feedback en zuiniger met runner-minuten.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck + rekenmotor-tests
    runs-on: ubuntu-latest
    # HUSKY=0: in CI hoeven er geen lokale git-hooks geïnstalleerd te worden
    # door het `prepare`-script tijdens `npm ci`.
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (versie uit .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # next-env.d.ts en .next/types staan buiten git (gitignored) en worden
      # normaal gegenereerd door `next dev` / `next build`. Op een verse
      # checkout ontbreken ze; `next typegen` genereert de route-/pagina-types
      # zonder een volledige build, zodat `tsc --noEmit` alle Next-types vindt.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # Lint-vangrails tegen drift (Arch F2, bevinding #22). De ESLint-
      # `no-restricted-syntax`-regels vangen klasse (1) error.message-lek in
      # API-responses en klasse (2) het parseFloat(toFixed)-afrondingsidioom;
      # klasse (3) hardcoded-constante-drift draait als vitest-scan mee in de
      # rekenmotor-stap hieronder (lib/architecture/formula-drift-scan.test.ts).
      # `--max-warnings` staat los: alleen errors blokkeren de gate, de vele
      # advisory react-compiler/any-warnings niet.
      - name: Lint-vangrails (eslint)
        run: npm run lint

      # Eén gerichte vitest-run over de rekenkern (FIRE/Horizon-kernel), de
      # Excel-oracle-pariteit (draait tegen de in-git fixtures onder
      # test/fixtures/horizon-oracle), de fiscale motoren (box1/box3/
      # fiscale-kerngetallen) en de architectuur-curatie. ~1.240 tests.
      #
      # lib/budget-utils.test.ts + de budget-berekeningen-suite-check dekken
      # de FIRE-uitgavenbasis (computeYearlyMustExpenses/
      # computeRetirementExpenses) die tot Arch F2 bevinding #17 alleen via de
      # dev-only in-app regressiesuite draaide — nu ook in deze CI-gate.
      - name: Rekenmotor- & pariteitstests (vitest)
        run: npx vitest run lib/horizon-kernel test/horizon-oracle lib/box1-tax lib/box3 lib/fiscale-kerngetallen lib/architecture lib/budget-utils.test.ts test/budget-berekeningen-suite-check.test.ts test/uat-stale-scan.test.ts

      # Versheidscheck: de gescande architectuurfeiten (docs/architecture/
      # architecture.json) worden door niets anders in CI/hooks vers gehouden —
      # alleen een dagelijkse externe Cowork-taak. Deze stap faalt wanneer de
      # gecommitte snapshot structureel achterloopt op de code (nieuwe tabel/
      # route/module/integratie zonder `npm run arch:diagram`). DB-vrij: scant
      # alleen bestanden, dus CI-veilig.
      - name: Architectuurfeiten-versheid (arch:check)

  # Bundle-budget (performance-programma fase 3, Task 3.4). Een volledige
  # `next build` is zwaar (~146 App-Router-routes) — draait daarom alleen op
  # pull_request (niet op elke branch-push zoals quality-gate) zodat gewone
  # commits tussendoor niet steeds een volledige build betalen. Eigen
  # concurrency-group zodat een nieuwe push op dezelfde PR de vorige
  # bundle-budget-run annuleert i.p.v. ernaast te blijven draaien.
  bundle-budget:
    name: Bundle-budget (per-route first-load JS, gzip)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      # `next build` embedt NEXT_PUBLIC_*-vars in de client-bundels, dus de
      # build heeft ZE nodig om te compileren — maar deze CI-job draait geen
      # echte backend-verificatie (alleen bundle-grootte meten), dus een
      # duidelijk-nep Supabase-project is voldoende en voorkomt dat een echte
      # sleutel in een PR-only workflow hoeft te lekken. Lokaal geverifieerd
      # (19-07-2026, review-fix Task 3.4): `next build` met ALLEEN deze twee
      # placeholders (geen enkele andere env-var) slaagt voor alle 145 routes,
      # geen enkele SSG-route faalt.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
    concurrency:
      group: ci-bundle-budget-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (versie uit .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # Alleen de Next-build (geen serwist/service-worker-stap) — dat is alles
      # wat scripts/perf/route-sizes.mjs nodig heeft (.next/-manifesten).
      - name: Production build (next build)
        run: npm run build:next-only

      # Leest de zojuist gebouwde .next/-manifesten, print de per-route
      # gzip-tabel, schrijft .next/route-sizes.json en faalt (exit 1) ALLEEN
      # als een route boven zijn eigen RATCHET-baseline × 1.04 komt (zie
      # RATCHET_TOLERANCE/BASELINE_PATH/BUDGET_OVERRIDES in het script). De
      # 300 kB-drempel blijft een gerapporteerde, niet-gatende "boven
      # target"-kolom.
      #
      # EENMALIGE SETUP (nog te doen door de eerste maintainer die dit
      # activeert): dit script draait REPORT-ONLY (exit 0, geen gate) zolang
      # scripts/perf/route-sizes.baseline.json ontbreekt — dat bestand MOET
      # hier op Linux-CI gegenereerd worden (gzip-bytes zijn platform-
      # gevoelig, dus een lokaal/Windows-gegenereerde baseline is geen
      # geldige ground truth voor deze runner). Procedure:
      #   1. Draai deze workflow eenmalig extra met
      #      `npm run perf:route-sizes -- --update-baseline` i.p.v.
      #      `npm run perf:route-sizes` (bv. via een tijdelijke workflow_dispatch-
      #      of debug-run), of genereer 'm lokaal op een Linux-runner/container.
      #   2. Commit het resulterende `scripts/perf/route-sizes.baseline.json`.
      #   3. Vanaf dan gate't deze stap normaal tegen die baseline; een latere
      #      `--update-baseline`-run mag de waarden alleen verlagen (monotone
      #      convergentie richting 300 kB), nooit optrekken.
      - name: Bundle-budget meten (route-sizes.mjs)
        run: npm run perf:route-sizes

  # Auth-smoke (Playwright) — kaart "Één Playwright smoke-spec (login →
  # dashboard → beveiligde route)". Opt-in en NIET-gatend (aanpak C uit de
  # kaartanalyse): draait alleen wanneer de vier onderstaande secrets in de
  # repo/organisatie zijn geconfigureerd, en blokkeert de PR/merge nooit
  # (`continue-on-error: true`) zolang er geen hermetische, hosted
  # test-Supabase-omgeving voor CI bestaat. Fork-PR's krijgen geen secrets
  # (GitHub-standaardgedrag) → de guard-stap zet `configured=false` → alle
  # vervolgstappen worden overgeslagen, job slaagt triviaal.
  #
  # Benodigde repo-secrets (menselijk-gated, nog niet gezet — zie
  # e2e/README.md):
  #   - E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY   (een test-Supabase-project,
  #     NOOIT het productieproject)
  #   - REGRESSION_TEST_EMAIL / REGRESSION_TEST_PASSWORD (bestaand,
  #     niet-admin testaccount — zelfde paar als lib/regression-tests)
  #
  # Vervolgkaart: zodra die omgeving bestaat, dit naar een echte, gatende
  # stap promoveren (continue-on-error weg, needs op quality-gate elders).
  e2e-smoke:
    name: E2E auth-smoke (Playwright, opt-in)
    needs: quality-gate
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets aanwezig?
        id: check-secrets
        run: |
          if [ -n "${{ secrets.E2E_SUPABASE_URL }}" ] && \
             [ -n "${{ secrets.E2E_SUPABASE_ANON_KEY }}" ] && \
             [ -n "${{ secrets.REGRESSION_TEST_EMAIL }}" ] && \
             [ -n "${{ secrets.REGRESSION_TEST_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E-smoke overgeslagen — secrets (E2E_SUPABASE_URL/ANON_KEY, REGRESSION_TEST_EMAIL/PASSWORD) zijn niet geconfigureerd. Zie e2e/README.md."
          fi

      - name: Setup Node (versie uit .nvmrc)
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright chromium
        if: steps.check-secrets.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Production build (tegen test-Supabase)
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm run build:next-only
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      # Start `next start` op de achtergrond, wacht tot 'ie antwoordt, draai
      # dan alleen de auth-smoke (niet de zwaardere, persona-seedende
      # uat/bezit.spec.ts — die blijft lokaal/menselijk-gated).
      - name: Server starten + auth-smoke draaien
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
          npx playwright test --config=e2e/playwright.config.ts smoke.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          REGRESSION_TEST_EMAIL: ${{ secrets.REGRESSION_TEST_EMAIL }}
          REGRESSION_TEST_PASSWORD: ${{ secrets.REGRESSION_TEST_PASSWORD }}
          UAT_BASE_URL: http://localhost:3000

      - name: Playwright-rapport bij falen
        if: steps.check-secrets.outputs.configured == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
