name: CI

# Kwaliteitspoort (enterprise-architectuurreview 3 jul 2026, bevinding #2,
# fase F2). De rekenkern is uitzonderlijk goed getest — Excel-oracle-pariteit
# tot ≤ €0,01, ~1.190 engine-tests — maar niets dwong die tests af: geen CI,
# en de husky pre-push draait alleen `tsc` met testbestanden uitgefilterd.
# Deze workflow dwingt de typecheck én de zwaarst-gewogen rekenmotor-tests
# af bij elke push en pull request, zodat een rekenregressie niet ongemerkt
# gemerged kan worden.

on:
  push:
    branches: ['**']
  pull_request:

# Een nieuwe push op dezelfde ref annuleert een nog lopende run: snellere
# feedback en zuiniger met runner-minuten.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck + rekenmotor-tests
    runs-on: ubuntu-latest
    # HUSKY=0: in CI hoeven er geen lokale git-hooks geïnstalleerd te worden
    # door het `prepare`-script tijdens `npm ci`.
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (versie uit .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # next-env.d.ts en .next/types staan buiten git (gitignored) en worden
      # normaal gegenereerd door `next dev` / `next build`. Op een verse
      # checkout ontbreken ze; `next typegen` genereert de route-/pagina-types
      # zonder een volledige build, zodat `tsc --noEmit` alle Next-types vindt.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # Lint-vangrails tegen drift (Arch F2, bevinding #22). De ESLint-
      # `no-restricted-syntax`-regels vangen klasse (1) error.message-lek in
      # API-responses en klasse (2) het parseFloat(toFixed)-afrondingsidioom;
      # klasse (3) hardcoded-constante-drift draait als vitest-scan mee in de
      # rekenmotor-stap hieronder (lib/architecture/formula-drift-scan.test.ts).
      # `--max-warnings` staat los: alleen errors blokkeren de gate, de vele
      # advisory react-compiler/any-warnings niet.
      - name: Lint-vangrails (eslint)
        run: npm run lint

      # Eén gerichte vitest-run over de rekenkern (FIRE/Horizon-kernel), de
      # Excel-oracle-pariteit (draait tegen de in-git fixtures onder
      # test/fixtures/horizon-oracle), de fiscale motoren (box1/box3/
      # fiscale-kerngetallen) en de architectuur-curatie. ~1.240 tests.
      #
      # lib/budget-utils.test.ts + de budget-berekeningen-suite-check dekken
      # de FIRE-uitgavenbasis (computeYearlyMustExpenses/
      # computeRetirementExpenses) die tot Arch F2 bevinding #17 alleen via de
      # dev-only in-app regressiesuite draaide — nu ook in deze CI-gate.
      - name: Rekenmotor- & pariteitstests (vitest)
        run: npx vitest run lib/horizon-kernel test/horizon-oracle lib/box1-tax lib/box3 lib/fiscale-kerngetallen lib/architecture lib/budget-utils.test.ts test/budget-berekeningen-suite-check.test.ts test/uat-stale-scan.test.ts

      # Versheidscheck: de gescande architectuurfeiten (docs/architecture/
      # architecture.json) worden door niets anders in CI/hooks vers gehouden —
      # alleen een dagelijkse externe Cowork-taak. Deze stap faalt wanneer de
      # gecommitte snapshot structureel achterloopt op de code (nieuwe tabel/
      # route/module/integratie zonder `npm run arch:diagram`). DB-vrij: scant
      # alleen bestanden, dus CI-veilig.
      - name: Architectuurfeiten-versheid (arch:check)
        run: npm run arch:check
